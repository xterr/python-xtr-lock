# The recipe for xtr-lock: what *Use in an application* in the README takes, as
# data. Keep the two in step — the README is the source.

[bundles]
# "<module>:<class>" = the environments it is listed with, exactly as in BUNDLES.
"xtr_lock.bundle:LockBundle" = { all = true }

[files]
# Destination under the application package = template under this recipe.
# The bundle's own defaults written out — the "default" resource on file locks,
# nothing opened until a factory is asked for — as the place resources go.
"config/packages/lock.py" = "files/config/lock.py.tmpl"

# No [env]: nothing is required. A DSN an application gives as env(...) must be
# set when it boots, because booting checks every resource.

[gitignore]
# A file lock lives under kernel.share_dir, var/share in the project.
lines = ["/var/"]

[notes]
check = ["<script> debug:bundles — lock is listed and active"]
